global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    scrape_interval: 10s
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: "hyperledger_metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["org1peer0:9443", "org0orderer:9443", "tape:9876"]
